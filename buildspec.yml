version: 0.2
phases:
  build:
    commands:
      - echo "Ejecutando la fase de construcción automatizada de CodeBuild..."
  post_build:
    commands:
      - echo "Desplegando en EC2 usando AWS Systems Manager..."
      - aws ssm send-command --instance-ids "i-PON_AQUI_TU_ID_DE_INSTANCIA" --document-name "AWS-RunShellScript" --parameters 'commands=["cd /home/ubuntu", "if [ ! -d avance-devops ]; then git clone https://github.com/lashmiadameleyv-art/avance-devops.git; fi", "cd avance-devops", "git pull origin main"]'
